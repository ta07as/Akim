<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talas_profi — Передатчик камеры</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #FBBF24; font-size: 24px; text-transform: uppercase; }
        .camera-container {
            max-width: 100%;
            width: 400px;
            margin: 20px auto;
            border: 2px solid #FBBF24;
            border-radius: 8px;
            overflow: hidden;
            background: #111111;
        }
        video { width: 100%; height: auto; display: block; }
        .info-box {
            background: #111;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 6px;
            display: inline-block;
        }
        input {
            padding: 10px;
            font-size: 16px;
            background: #000;
            color: #FFF;
            border: 1px solid #FBBF24;
            border-radius: 4px;
            margin-right: 10px;
        }
        button {
            background-color: #FBBF24;
            color: #000000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        #status { color: #AAAAAA; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <h1>Камера-Передатчик</h1>

    <div class="info-box">
        <p>Ваш ID камеры: <strong id="my-peer-id" style="color: #FBBF24;">Генерация...</strong></p>
        <p>Введите ID главного экрана:</p>
        <input type="text" id="target-id-input" placeholder="ID главного экрана">
        <button id="start-broadcast-btn">Включить и передать</button>
    </div>

    <div class="camera-container">
        <video id="local-video" autoplay playsinline muted></video>
    </div>

    <div id="status">Ожидание запуска камеры...</div>

    <script>
        const peer = new Peer();
        const localVideo = document.getElementById('local-video');
        const statusDiv = document.getElementById('status');
        const idDisplay = document.getElementById('my-peer-id');
        let localStream = null;

        peer.on('open', (id) => {
            idDisplay.textContent = id;
            statusDiv.textContent = "Готово к трансляции.";
        });

        // Предпросмотр камеры сразу
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })
            .then((stream) => {
                localStream = stream;
                localVideo.srcObject = stream;
            })
            .catch(err => {
                statusDiv.textContent = "Ошибка доступа к камере!";
            });

        // Нажатие кнопки трансляции на главный экран
        document.getElementById('start-broadcast-btn').addEventListener('click', () => {
            const targetId = document.getElementById('target-id-input').value.trim();
            if (!targetId || !localStream) {
                alert("Введите ID главного экрана!");
                return;
            }

            statusDiv.textContent = "Звонок на главный экран...";
            const call = peer.call(targetId, localStream);
            
            call.on('open', () => {
                statusDiv.textContent = "Трансляция идет!";
            });
            call.on('error', (err) => {
                statusDiv.textContent = "Ошибка соединения: " + err;
            });
        });
    </script>

</body>
</html>
