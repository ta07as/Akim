<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивный урок</title>
</head>
<body>





<section class="tp-lesson-hero" style="background: #000; padding: 100px 20px; text-align: center;">
    <span class="tp-badge" style="color: #FBBF24; letter-spacing: 4px;">УРОК №1</span>
    <h1 style="color: #fff; font-size: 40px; text-transform: uppercase;">Приключения в <span style="color: #FBBF24;">мире знаний</span></h1>
</section>

<section class="tp-video-game-block" style="background: #0a0a0a; padding: 40px 0; border-top: 2px solid #FBBF24;">
    <div style="max-width: 900px; margin: 0 auto; position: relative; border: 3px solid #1a1a1a; border-radius: 15px; overflow: hidden;">
        
        <video id="lessonVideo" style="width: 100%; display: block;" autoplay muted>
            <source src="intro_walk.mp4" type="video/mp4">
        </video>

        <div id="quizOverlay" style="display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.9); flex-direction: column; justify-content: center; align-items: center; z-index: 100;">
            <h2 id="questionText" style="color: #FBBF24; font-size: 24px; margin-bottom: 30px; text-align: center; padding: 0 20px;"></h2>
            <div id="optionsContainer" style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">
                </div>
        </div>

    </div>
</section>

<section class="tp-numbers-block">
    <div class="tp-numbers-container">
        <div class="tp-number-card show">
            <div class="tp-num-wrapper"><span class="num" id="score">0</span></div>
            <span class="label">Очков набрано</span>
        </div>
        </div>
</section>

<script>
    const video = document.getElementById('lessonVideo');
    const overlay = document.getElementById('quizOverlay');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');

    // База данных уровней
    const levels = {
        'intro': {
            stopAt: 5, // на какой секунде показать вопрос
            question: "Сколько колес у машины?",
            options: [
                { text: "Два", correct: false, nextVideo: "fail_reaction.mp4" },
                { text: "Четыре", correct: true, nextVideo: "win_move_next.mp4" }
            ]
        }
    };

    video.ontimeupdate = () => {
        // Если дошли до времени вопроса в текущем сценарии
        if (Math.floor(video.currentTime) === levels.intro.stopAt) {
            video.pause();
            showQuiz(levels.intro);
        }
    };

    function showQuiz(data) {
        questionText.innerText = data.question;
        optionsContainer.innerHTML = '';
        
        data.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt.text;
            // Стилизуем кнопку под ваш бренд (желтая с черным текстом)
            btn.style = "background: #FBBF24; color: #000; border: none; padding: 15px 40px; font-weight: 900; cursor: pointer; text-transform: uppercase;";
            
            btn.onclick = () => {
                overlay.style.display = 'none';
                video.src = opt.nextVideo;
                video.play();
                if(opt.correct) updateScore();
            };
            optionsContainer.appendChild(btn);
        });
        
        overlay.style.display = 'flex';
    }

    function updateScore() {
        let s = document.getElementById('score');
        s.innerText = parseInt(s.innerText) + 10;
    }
</script>








</body>
</html>
