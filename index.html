<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talas_profi — Просмотр камеры</title>
    <!-- Подключаем PeerJS для связи между устройствами -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #FBBF24; font-size: 24px; text-transform: uppercase; }
        .camera-container {
            max-width: 100%;
            width: 400px;
            margin: 20px auto;
            border: 2px solid #FBBF24;
            border-radius: 8px;
            overflow: hidden;
            background: #111111;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .info-box {
            background: #111;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 10px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            background: #000;
            color: #FFF;
            border: 1px solid #FBBF24;
            border-radius: 4px;
            margin-right: 10px;
        }
        button {
            background-color: #FBBF24;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border5-radius: 4px;
            cursor: pointer;
            border-radius: 4px;
        }
        #status { color: #AAAAAA; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <h1>Talas_profi — Монитор</h1>
    
    <div class="info-box">
        <p>Ваш ID приемника: <strong id="my-peer-id" style="color: #FBBF24;">Генерация...</strong></p>
        <p>Введите ID второго устройства (камеры):</p>
        <input type="text" id="remote-id-input" placeholder="ID камеры">
        <button id="connect-btn">Подключить</button>
    </div>

    <div class="camera-container">
        <video id="remote-video" autoplay playsinline></video>
    </div>

    <div id="status">Ожидание подключения...</div>

    <script>
        const peer = new Peer(); // Создаем узел связи
        const remoteVideo = document.getElementById('remote-video');
        const statusDiv = document.getElementById('status');
        const idDisplay = document.getElementById('my-peer-id');

        peer.on('open', (id) => {
            idDisplay.textContent = id;
            statusDiv.textContent = "Готово. Введите ID второго устройства сверху.";
        });

        // Когда второе устройство само звонит нам
        peer.on('call', (call) => {
            call.answer(); // Отвечаем на звонок без отправки своего видео
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
                statusDiv.textContent = "Трансляция запущена!";
            });
        });

        // Кнопка подключения (если мы инициируем связь)
        document.getElementById('connect-btn').addEventListener('click', () => {
            const remoteId = document.getElementById('remote-id-input').value.trim();
            if (!remoteId) return;

            statusDiv.textContent = "Подключение к " + remoteId + "...";
            
            // Запрашиваем пустой поток (так как мы только принимаем)
            navigator.mediaDevices.getUserMedia({ video: false, audio: false })
                .then((stream) => {
                    const call = peer.call(remoteId, stream);
                    call.on('stream', (remoteStream) => {
                        remoteVideo.srcObject = remoteStream;
                        statusDiv.textContent = "Трансляция активна!";
                    });
                })
                .catch(err => {
                    console.error(err);
                });
        });
    </script>

</body>
</html>
