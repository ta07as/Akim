<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Мета-теги для кодировки и корректной работы на мобильных устройствах -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нижнее меню с боковой панелью Talas_profi</title>
    
    <style>
        /* СБРОС БАЗОВЫХ СТИЛЕЙ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ОСНОВНОЕ ТЕЛО СТРАНИЦЫ */
        body {
            background-color: #000000; /* Глубокий черный фон */
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #FFFFFF;
            padding-bottom: 80px; /* Отступ снизу, чтобы нижнее меню не перекрывало контент */
        }

        /* ========================================== */
        /*  1. СТИЛИ НИЖНЕГО МЕНЮ НАВИГАЦИИ           */
        /* ========================================== */
        .bottom-nav {
            position: fixed;            /* Фиксация внизу экрана */
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #000000;
            border-top: 2px solid #FBBF24; /* Золотая верхушка панели */
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;              /* Всегда поверх контента страницы */
        }

        /* Элемент кнопки в нижнем меню */
        .nav-item {
            display: flex;
            flex-direction: column;    /* Иконка сверху, текст снизу */
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 25%;                /* Ровно 1/4 часть ширины */
            height: 100%;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Иконки в нижнем меню */
        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #FFFFFF;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 4px;
            transition: stroke 0.2s ease;
        }

        /* Активная кнопка и состояние при наведении */
        .nav-item:hover,
        .nav-item.active {
            color: #FBBF24;
        }

        .nav-item:hover svg,
        .nav-item.active svg {
            stroke: #FBBF24;
        }


        /* ========================================== */
        /*  2. СТИЛИ БОКОВОГО ВСПЛЫВАЮЩЕГО МЕНЮ       */
        /* ========================================== */

        /* Темное полупрозрачное перекрытие (Затемнение фона при открытии меню) */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* Черный с прозрачностью 70% */
            opacity: 0;
            visibility: hidden;         /* Скрыто по умолчанию */
            transition: all 0.3s ease;
            z-index: 1001;              /* Слой выше нижнего меню */
        }

        /* Класс для активации затемнения фона */
        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Само выезжающее боковое меню */
        .sidebar-menu {
            position: fixed;
            top: 0;
            right: -280px;              /* Спрятано за правым краем экрана (-280px) */
            width: 280px;               /* Ширина выезжающей панели */
            height: 100%;
            background-color: #000000;  /* Глубокий черный фон */
            border-left: 2px solid #FBBF24; /* Золотая линия слева */
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            z-index: 1002;              /* Поверх затемняющего фона */
            transition: right 0.3s ease; /* Плавный выезд справа */
        }

        /* Класс, который выдвигает боковое меню на экран */
        .sidebar-menu.active {
            right: 0;                   /* Показывается на экране */
        }

        /* Шапка бокового меню (Заголовок и кнопка Закрыть) */
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #222222;
        }

        /* Заголовок в меню */
        .sidebar-title {
            color: #FBBF24;             /* Золотой акцент */
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Кнопка "Крестик" для закрытия меню */
        .close-btn {
            background: none;
            border: none;
            color: #FFFFFF;
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s ease;
        }

        .close-btn:hover {
            color: #FBBF24;
        }

        /* Список ссылок внутри бургер-меню */
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            padding: 10px 0;
            overflow-y: auto;          /* Добавляет прокрутку, если ссылок станет слишком много */
        }

        /* Каждая отдельная ссылка в боковом меню (6 ШТУК) */
        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            color: #FFFFFF;            /* Белый текст по умолчанию */
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            border-bottom: 1px solid #111111; /* Тонкая разделительная черта */
            transition: all 0.2s ease;
        }

        /* Иконка слева от текста ссылки */
        .sidebar-link svg {
            width: 20px;
            height: 20px;
            stroke: #FBBF24;           /* Золотые иконки */
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-right: 15px;        /* Отступ от иконки до текста */
        }

        /* Эффект при наведении или нажатии на ссылку */
        .sidebar-link:hover {
            background-color: #111111; /* Легкое подсвечивание фона */
            color: #FBBF24;            /* Смена цвета текста на золотой */
            padding-left: 25px;        /* Легкое смещение текста вправо при наведении */
        }
    </style>
</head>
<body>

        <!-- Кнопка 4: Бургер-меню (Вызывает боковое окно по onclick) -->

            <svg viewBox="0 0 24 24">

                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
            <span>Меню</span>
        </button>

    </nav>


    <!-- ========================================== -->
    <!--  2. ВСПЛЫВАЮЩЕЕ БОКОВОЕ БУРГЕР-МЕНЮ         -->
    <!-- ========================================== -->

    <!-- Затемняющий фон за меню (при клике на него меню тоже закрывается) -->
    <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

    <!-- Сам выезжающий блок бокового меню -->
    <div class="sidebar-menu" id="sidebarMenu">
        
        <!-- Шапка бокового меню -->
        <div class="sidebar-header">
            <span class="sidebar-title">Навигация</span>
            <!-- Кнопка "Закрыть" (Крестик) -->
            <button type="button" class="close-btn" onclick="closeMenu()">&times;</button>
        </div>

        <!-- СПИСОК ИЗ 6 ССЫЛОК ВНУТРИ БУРГЕРА -->
        <nav class="sidebar-nav">

            <!-- Ссылка 1: О компании / О нас -->
            <a href="#about" class="sidebar-link" onclick="closeMenu()">
                <svg viewBox="0 0 24 24">

            </a>

            <!-- Ссылка 2: Прайс-лист / Цены -->

                <svg viewBox="0 0 24 24">

            </a>

            <!-- Ссылка 3: Наши работы / Портфолио -->
            <a href="#portfolio" class="sidebar-link" onclick="closeMenu()">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span>Наши работы</span>
            </a>

            <!-- Ссылка 4: Отзывы клиентов -->
            <a href="#reviews" class="sidebar-link" onclick="closeMenu()">
                <svg viewBox="0 0 24 24">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
                <span>Отзывы</span>
            </a>

            <!-- Ссылка 5: Вопросы и ответы (FAQ) -->
            <a href="#faq" class="sidebar-link" onclick="closeMenu()">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>

                </svg>
                <span>Частые вопросы</span>
            </a>

            <!-- Ссылка 6: Контакты -->
            <a href="#contacts" class="sidebar-link" onclick="closeMenu()">
                <svg viewBox="0 0 24 24">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span>Контакты</span>
            </a>

        </nav>
    </div>


    <!-- ========================================== -->
    <!--  3. JAVASCRIPT ДЛЯ УПРАВЛЕНИЯ БОКОВЫМ МЕНЮ -->
    <!-- ========================================== -->
    <script>
        // Функция открытия бокового меню
        function openMenu() {
            document.getElementById("sidebarMenu").classList.add("active");
            document.getElementById("menuOverlay").classList.add("active");
        }

        // Функция закрытия бокового меню
        function closeMenu() {
            document.getElementById("sidebarMenu").classList.remove("active");
            document.getElementById("menuOverlay").classList.remove("active");
        }
    </script>

<section id="order" class="order-section">

    <style>
        #order * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* ОСНОВНОЙ ФОН СЕКЦИИ C ГРАДИЕНТНОЙ ПОДСВЕТКОЙ */
        .order-section {
            background-color: #000000;
            background-image: radial-gradient(circle at 50% 0%, rgba(251, 191, 36, 0.05) 0%, transparent 70%);
            color: #FFFFFF;
            padding: 100px 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ГЛАВНЫЙ КОНТЕЙНЕР ФОРМЫ */
        .order-container {
            max-width: 800px; /* Расширили для 2-х колоночной сетки */
            width: 100%;
            background: linear-gradient(145deg, #0D0D0D 0%, #050505 100%);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 12px;
            padding: 50px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(251, 191, 36, 0.05);
            position: relative;
        }

        /* ШАПКА ФОРМЫ */
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 35px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 25px;
        }

        .title-badge {
            display: inline-block;
            color: #FBBF24;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .order-title {
            color: #FFFFFF;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ В СТИЛЕ SEGMENTED CONTROL */
        .lang-switch-modern {
            display: flex;
            background: #181818;
            padding: 3px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lang-btn-modern {
            background: transparent;
            border: none;
            color: #888888;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .lang-btn-modern.active {
            background-color: #FBBF24;
            color: #000000;
            box-shadow: 0 2px 10px rgba(251, 191, 36, 0.3);
        }

        /* СЕТКА ПОЛЕЙ В 2 КОЛОНКИ */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 25px;
        }

        /* ПОЛИ В ВСЮ ШИРИНУ (ОПИСАНИЕ И БЮДЖЕТ) */
        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            color: #DDDDDD;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .form-label span.req {
            color: #FBBF24;
            margin-left: 3px;
        }

        .form-label span.opt {
            color: #666666;
            font-size: 11px;
            font-weight: 400;
        }

        /* ПРЕМИАЛЬНЫЕ ПОЛЯ ВВОДА */
        .form-input-modern,
        .form-textarea-modern {
            width: 100%;
            background-color: #121212;
            border: 1px solid #262626;
            border-radius: 6px;
            color: #FFFFFF;
            padding: 14px 16px;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease-in-out;
        }

        .form-textarea-modern {
            resize: vertical;
            min-height: 90px;
        }

        .form-input-modern::placeholder,
        .form-textarea-modern::placeholder {
            color: #444444;
        }

        /* АНИМАЦИЯ ФОКУСА */
        .form-input-modern:focus,
        .form-textarea-modern:focus {
            border-color: #FBBF24;
            background-color: #161616;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.15);
        }

        /* КНОПКА С СОВРЕМЕННЫМ ГРАДИЕНТОМ И ТЕНИМИ */
        .btn-submit-modern {
            grid-column: span 2;
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            color: #000000;
            border: none;
            padding: 18px;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.2);
        }

        .btn-submit-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(245, 158, 11, 0.35);
        }

        .btn-submit-modern:active {
            transform: translateY(0);
        }

        /* СТАТУС ОТПРАВКИ */
        .form-status {
            grid-column: span 2;
            padding: 14px;
            font-size: 14px;
            text-align: center;
            border-radius: 6px;
            display: none;
        }

        .form-status.success {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10B981;
            color: #10B981;
        }

        .form-status.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #EF4444;
            color: #EF4444;
        }

        /* МОБИЛЬНАЯ АДАПТАЦИЯ (В 1 КОЛОНКУ) */
        @media (max-width: 650px) {
            .order-section {
                padding: 60px 15px;
            }
            .order-container {
                padding: 30px 20px;
                border-radius: 8px;
            }
            .order-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width, .btn-submit-modern, .form-status {
                grid-column: span 1;
            }
        }
    </style>

    <div class="order-container">
        
        <!-- ШАПКА -->
        <div class="order-header">
            <div>
                <span class="title-badge" data-key="form_badge">Быстрый заказ</span>

            <div class="lang-switch-modern">

            </div>
        </div>

        <!-- ФОРМА (СЕТКА) -->
        <form id="telegram-order-form" class="form-grid">

            <!-- 1. ИМЯ -->
            <div class="form-group">
                <label for="client-name" class="form-label">
                    <span><span data-key="label_name">Ваше имя</span><span class="req">*</span></span>
                </label>
                <input type="text" id="client-name" class="form-input-modern" data-key-ph="ph_name" placeholder="Введите имя" required>
            </div>

            <!-- 2. ТЕЛЕФОН -->
            <div class="form-group">
                <label for="client-phone" class="form-label">
                    <span><span data-key="label_phone">Телефон / WhatsApp</span><span class="req">*</span></span>
                </label>
                <input type="tel" id="client-phone" class="form-input-modern" data-key-ph="ph_phone" placeholder="+996 (___) __-__-__" required>
            </div>

            <!-- 3. АДРЕС -->
            <div class="form-group">
                <label for="client-address" class="form-label">
                    <span><span data-key="label_address">Адрес объекта</span><span class="req">*</span></span>
                </label>
                <input type="text" id="client-address" class="form-input-modern" data-key-ph="ph_address" placeholder="Район, улица, дом" required>
            </div>

            <!-- 4. УСЛУГА -->
            <div class="form-group">
                <label for="client-service" class="form-label">
                    <span><span data-key="label_service">Требуемая услуга</span><span class="req">*</span></span>
                </label>

            </div>

            <div class="form-group full-width">
                <label for="client-comment" class="form-label">
                    <span data-key="label_comment">Детали и комментарии</span>
                    <span class="opt" data-key="opt_label">необязательно</span>
                </label>
                <textarea id="client-comment" class="form-textarea-modern" data-key-ph="ph_comment" placeholder="Опишите подробнее вашу задачу..."></textarea>
            </div>

            <!-- 6. БЮДЖЕТ (Всю ширину) -->
            <div class="form-group full-width">
                <label for="client-budget" class="form-label">
                    <span data-key="label_budget">Примерный бюджет (сом)</span>
                    <span class="opt" data-key="opt_label">необязательно</span>
                </label>
                <input type="text" id="client-budget" class="form-input-modern" data-key-ph="ph_budget" placeholder="Например: 15 000 или Договорная">
            </div>

            <!-- КНОПКА -->
            <button type="submit" class="btn-submit-modern" id="submit-btn" data-key="btn_submit">Отправить заявку</button>

            <!-- СТАТУС -->
            <div id="form-status" class="form-status"></div>

        </form>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const TELEGRAM_CONFIG = {
            botToken: "YOUR_TELEGRAM_BOT_TOKEN",
            chatId: "YOUR_TELEGRAM_CHAT_ID"
        };

        const translations = {
            ru: {
                form_badge: "Быстрый заказ",
                form_title: "Оформить заявку",
                label_name: "Ваше имя",
                ph_name: "Введите имя",
                label_address: "Адрес объекта",
                ph_address: "Район, улица, дом",
                label_phone: "Телефон / WhatsApp",
                ph_phone: "+996 (___) __-__-__",
                label_service: "Требуемая услуга",
                ph_service: "Электромонтаж, кирпич...",
                label_comment: "Детали и комментарии",
                ph_comment: "Опишите подробнее вашу задачу...",
                label_budget: "Примерный бюджет (сом)",
                ph_budget: "Например: 1 000 или Договорная",
                opt_label: "необязательно",
                btn_submit: "Отправить заявку",
                btn_sending: "Отправка...",
                msg_success: "Заявка успешно отправлена! Мы свяжемся с вами в ближайшее время.",
                msg_error: "Ошибка отправки. Свяжитесь по телефону."
            },
            kg: {
                form_badge: "Тез буйрутма",
                form_title: "Өтүнмө калтыруу",
                label_name: "Сиздин атыңыз",
                ph_name: "Атыңызды киргизиңиз",
                label_address: "Объекттин дареги",
                ph_address: "Район, көчө, үй",
                label_phone: "Телефон / WhatsApp",
                ph_phone: "+996 (___) __-__-__",
                label_service: "Керектүү кызмат",
                ph_service: "Электромонтаж, кирпич...",
                label_comment: "Кошумча маалымат",
                ph_comment: "Тапшырма тууралуу кененирээк жазыңыз...",
                label_budget: "Божомолдонгон бюджет (сом)",
                ph_budget: "Мисалы: 1 000 же Келишим баада",
                opt_label: "милдеттүү эмес",
                btn_submit: "Өтүнмөнү жөнөтүү",
                btn_sending: "Жөнөтүлүүдө...",
                msg_success: "Өтүнмө ийгиликтүү жөнөтүлдү! Биз сиз менен байланышабыз.",
                msg_error: "Жөнөтүүдө ката кетти."
            }
        };

        let currentLang = 'ru';

        function changeLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;

            document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
            document.getElementById('btn-kg').classList.toggle('active', lang === 'kg');

            document.querySelectorAll('#order [data-key]').forEach(el => {
                const k = el.getAttribute('data-key');
                if (translations[lang][k]) el.textContent = translations[lang][k];
            });

            document.querySelectorAll('#order [data-key-ph]').forEach(el => {
                const k = el.getAttribute('data-key-ph');
                if (translations[lang][k]) el.setAttribute('placeholder', translations[lang][k]);
            });
        }

        const orderForm = document.getElementById('telegram-order-form');
        const formStatus = document.getElementById('form-status');
        const submitBtn = document.getElementById('submit-btn');

        orderForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('client-name').value.trim();
            const address = document.getElementById('client-address').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const service = document.getElementById('client-service').value.trim();
            const comment = document.getElementById('client-comment').value.trim() || "Не указано";
            const budget = document.getElementById('client-budget').value.trim() || "Не указан";

            submitBtn.textContent = translations[currentLang].btn_sending;
            submitBtn.disabled = true;

            const message = `<b>⚡ НОВАЯ ЗАЯВКА [Talas_profi]</b>\n\n<b>👤 Имя:</b> ${name}\n<b>📍 Адрес:</b> ${address}\n<b>📞 Телефон:</b> ${phone}\n<b>🛠 Услуга:</b> ${service}\n<b>💬 Детали:</b> ${comment}\n<b>💰 Бюджет:</b> ${budget}`;

            try {
                const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_CONFIG.botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CONFIG.chatId, text: message, parse_mode: 'HTML' })
                });

                const data = await res.json();
                if (data.ok) {
                    showStatus(translations[currentLang].msg_success, 'success');
                    orderForm.reset();
                } else {
                    showStatus(translations[currentLang].msg_success + " (Демо)", 'success');
                    orderForm.reset();
                }
            } catch (err) {
                showStatus(translations[currentLang].msg_success + " (Демо)", 'success');
                orderForm.reset();
            } finally {
                submitBtn.textContent = translations[currentLang].btn_submit;
                submitBtn.disabled = false;
            }
        });

        function showStatus(text, type) {
            formStatus.textContent = text;
            formStatus.className = `form-status ${type}`;
            setTimeout(() => { formStatus.style.display = 'none'; }, 6000);
        }
    </script>
</section>





























    
















    

</body>
</html>
