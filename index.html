    <title>Talas_profi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            min-height: 200vh; /* Сделано для проверки прокрутки */
        }

        /* ШАПКА САЙТА */
        .site-header {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid #262626;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 1px;
        }

        .logo span {
            color: #FBBF24;
        }

        .header-btn {
            background-color: #FBBF24;
            color: #000000;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 700;
            text-decoration: none;
            font-size: 14px;
            transition: opacity 0.2s;
            display: inline-block;
        }

        .header-btn:hover {
            opacity: 0.9;
        }

        /* ПЛАВАЮЩАЯ КНОПКА WHATSAPP */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25D366;
            color: #FFFFFF;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 1001;
            text-decoration: none;
            transition: transform 0.3s, background-color 0.3s;
            animation: pulse-whatsapp 2s infinite;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            background-color: #20ba5a;
        }

        .whatsapp-float svg {
            width: 36px;
            height: 36px;
            fill: #FFFFFF;
        }

        @keyframes pulse-whatsapp {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(37, 211, 102, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 768px) {
            .header-container {
                padding: 15px;
            }
            .logo {
                font-size: 20px;
            }
            .header-btn {
                padding: 8px 14px;
                font-size: 13px;
            }
            .whatsapp-float {
                bottom: 20px;
                right: 20px;
                width: 55px;
                height: 55px;
            }
            .whatsapp-float svg {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>
