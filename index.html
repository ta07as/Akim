<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ к камере</title>
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h2 {
            color: #FBBF24;
            margin-bottom: 20px;
        }
        .camera-container {
            max-width: 100%;
            width: 400px;
            margin: 0 auto;
            border: 2px solid #FBBF24;
            border-radius: 8px;
            overflow: hidden;
            background: #111111;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        button {
            background-color: #FBBF24;
            color: #000000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #error-msg {
            color: #EF4444;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>Сканирование / Камера</h2>
    
    <div class="camera-container">
        <!-- Видеопоток с камеры -->
        <video id="camera-stream" autoplay playsinline muted></video>
    </div>

    <button id="start-btn">Включить камеру</button>
    <div id="error-msg"></div>

    <script>
        const videoElement = document.getElementById('camera-stream');
        const startButton = document.getElementById('start-btn');
        const errorMsg = document.getElementById('error-msg');

        startButton.addEventListener('click', async () => {
            errorMsg.textContent = '';
            
            try {
                // Запрос доступа к тыловой камере телефона (если поддерживается)
                const constraints = {
                    video: {
                        facingMode: { ideal: "environment" } // "user" для фронтальной, "environment" для задней
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                // Передаем поток в элемент <video>
                videoElement.srcObject = stream;
                startButton.style.display = 'none'; // Скрываем кнопку после успешного запуска
                
            } catch (err) {
                console.error("Ошибка доступа к камере: ", err);
                errorMsg.textContent = "Не удалось получить доступ к камере. Проверьте разрешения в настройках браузера.";
            }
        });
    </script>

</body>
</html>
